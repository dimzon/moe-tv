name: Сообщение об ошибке
description: Что-то не работает в МОЁ ТВ / MyOwnTV (эфир, программа передач, навигация, настройки…)
title: "[Баг] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что помогаете улучшать МОЁ ТВ / MyOwnTV! Чем больше деталей — тем быстрее исправим.

        **Этот форк — клиент только прямого эфира публичного каталога RuTube.** Здесь нет
        плейлистов, провайдеров, аккаунтов, VOD, catch-up и профилей. Сообщения про
        Xtream / M3U / Stalker / фильмы / сериалы относятся к апстримовому OwnTV, а не сюда.

  - type: checkboxes
    id: mandatory_checks
    attributes:
      label: Перед отправкой (обязательно)
      description: >
        Большинство вопросов уже раскрыто в самом приложении или в разделе форка в начале
        Руководства пользователя. Пожалуйста, действительно проверьте — все три пункта обязательны.
      options:
        - label: >
            Я прочитал **[Руководство пользователя](https://github.com/dimzon/moe-tv/blob/main/extras/USER_GUIDE.md)**
            (раздел форка в начале) и проверил **Настройки** и нужные **функции приложения**.
          required: true
        - label: Я искал существующие issues и это не дубликат.
          required: true
        - label: >
            У меня последняя версия (Ещё → О приложении), я перезапустил приложение и дождался
            обновления списка каналов и программы передач.
          required: true

  - type: textarea
    id: what_happens
    attributes:
      label: Что происходит
      description: Опишите проблему. Что вы ожидали и что получилось вместо этого?
    validations:
      required: true

  - type: textarea
    id: onscreen_error
    attributes:
      label: Ошибка на экране ⚠️ важно
      description: >
        При сбое воспроизведения плеер показывает понятное сообщение и маленькую строку
        «err: ...» внизу. Скопируйте её ДОСЛОВНО сюда (или приложите фото).
      placeholder: "err: "
      render: text

  - type: textarea
    id: steps
    attributes:
      label: Шаги для воспроизведения
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: setup
    attributes:
      label: Ваша конфигурация
      value: |
        - **Устройство и модель:**
        - **Версия Android TV / Fire OS:**
        - **Версия приложения (Ещё → О приложении):**
        - **Канал / передача:** (название канала RuTube или запись в программе)
        - **Сеть:** Wi-Fi / Ethernet — воспроизводится ли тот же поток в приложении или на сайте RuTube?
    validations:
      required: true

  - type: textarea
    id: screenshot
    attributes:
      label: Скриншот / фото
      description: Скриншот или фото экрана телевизора очень помогают, особенно для экрана с ошибкой.

  - type: textarea
    id: logcat
    attributes:
      label: Logcat (необязательно, но полезнее всего)
      description: >
        Если можете, снимите logcat и приложите. Нужную adb-команду можно спросить в issue.
        ⚠️ Удалите из лога личные данные, токены и идентификаторы аккаунтов.
