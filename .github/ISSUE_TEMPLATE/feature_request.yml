name: Предложение / идея
description: Предложить улучшение для МОЁ ТВ / MyOwnTV
title: "[Идея] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        У этого форка намеренно узкая задача: **прямой эфир из публичного каталога RuTube и
        программа передач на Android TV, без аккаунта и настройки плейлистов**. Просьбы вернуть
        провайдеров Xtream / M3U / Stalker, фильмы/сериалы, трейлеры, загрузки, catch-up или
        профили здесь не рассматриваются — их стоит отнести в апстримовый
        [OwnTV](https://github.com/ahXN00/OwnTV).

  - type: checkboxes
    id: mandatory_checks
    attributes:
      label: Перед отправкой (обязательно)
      description: >
        Часть идей уже реализована в приложении под другим названием или в Настройках. Проверьте
        сначала — оба пункта обязательны.
      options:
        - label: >
            Я прочитал **[Руководство пользователя](https://github.com/dimzon/moe-tv/blob/main/extras/USER_GUIDE.md)**
            и проверил **Настройки** и существующие **функции** — этого в приложении ещё нет.
          required: true
        - label: Я искал существующие issues и такую идею ещё не предлагали.
          required: true

  - type: textarea
    id: idea
    attributes:
      label: Идея
      description: Что должно уметь МОЁ ТВ / MyOwnTV?
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Зачем — какую проблему это решает
      description: Что сейчас неудобно или что станет лучше?
    validations:
      required: true

  - type: textarea
    id: how
    attributes:
      label: Как это должно работать
      description: "Необязательно: где в интерфейсе, как вызывается, примеры из других приложений."
