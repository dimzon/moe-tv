name: Чек-лист PR

# Не даёт смержить PR, пока в описании не отмечены обязательные галочки из шаблона.
# GitHub умеет требовать галочки только в *issue forms*, но не в PR — поэтому проверяем здесь.

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  verify-acknowledgement:
    # Ежемесячный сгруппированный Dependabot-апдейт экшенов — не контрибуция: у него нет шаблона
    # PR, а «поиск существующих issues» бессмысленен для апдейта версии. Его логин нельзя занять
    # никому другому, поэтому исключение безопасно.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Проверить обязательные галочки
        uses: actions/github-script@v9
        with:
          script: |
            const body = context.payload.pull_request.body || "";

            // Каждый обязательный пункт узнаётся по характерной фразе из шаблона PR.
            // Фразы на русском — они ДОЛЖНЫ дословно совпадать с PULL_REQUEST_TEMPLATE.md.
            const required = [
              { name: "Руководство прочитано, Настройки и функции проверены", needle: "проверил **Настройки**" },
              { name: "Поиск по существующим issues/PR", needle: "искал существующие issues/PR" },
            ];

            // Пункт считается отмеченным, если в его строке есть "[x]" в любом регистре.
            const isTicked = (needle) => {
              const line = body.split(/\r?\n/).find(l => l.includes(needle));
              return !!line && /\[[xX]\]/.test(line);
            };

            const missing = required.filter(r => !isTicked(r.needle)).map(r => r.name);

            if (missing.length) {
              core.setFailed(
                "Отметьте обязательные пункты в описании PR, прежде чем его можно будет ревьюить:\n" +
                missing.map(m => `  - [ ] ${m}`).join("\n") +
                "\n\nОтредактируйте описание, поставьте [x] — проверка запустится снова."
              );
            } else {
              core.info("Все обязательные пункты отмечены. ✅");
            }
