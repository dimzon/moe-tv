name: Android CI

# Two jobs:
#   check — unit tests + lint. The gate on EVERY push, tag and pull request.
#   build — assembles the universal APK on v* tags and manual workflow_dispatch as a build check
#           + CI artifact. It does NOT publish binaries: APKs are shipped only from the separate
#           dimzon/moe-tv-site releases (publish.cmd). It does NOT run on ordinary pushes to main
#           or on PRs: assembleUniversalDebug takes ~11 minutes, and running it on every commit
#           made each new push cancel the previous build (and left the run red).
#
# All sources, including the former OwnTV_Core code and strings, are in this repository — there
# is no external core artifact, Maven repository, pin or edge-key secret to resolve.
on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read    # this workflow only builds and uploads CI artifacts; it publishes no Release

# Everything needed to build is in this repository; no external Maven repository, token or
# secret is required to resolve dependencies.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Only PRs benefit from superseding an older run. On main a newer push must not kill a
  # long build of the previous commit (that showed up as "The operation was canceled.").
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Nothing was checking the unit tests or lint before, so both could rot silently while the APK
  # kept building. This job is the gate: if it is red, no APK is produced and no release is cut.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # One variant, not `test`/`lint` across every flavor: universal+debug is the variant we ship,
      # so the gate must exercise the exact flavor that reaches users.
      - name: Unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testUniversalDebugUnitTest --stacktrace

      # abortOnError = true in app/build.gradle.kts, so this fails the job on a lint error.
      - name: Lint
        if: always()   # report both verdicts in one run instead of one failure at a time
        run: ./gradlew lintUniversalDebug --stacktrace

      - name: Upload test and lint reports
        if: always()   # the reports matter most when the step above failed
        uses: actions/upload-artifact@v7
        with:
          name: check-reports
          path: |
            app/build/reports/tests/**
            app/build/reports/lint-results-*.html
            app/build/reports/lint-results-*.txt
          if-no-files-found: warn

  build:
    needs: check
    # Only release tags and a manual run need an APK. Ordinary pushes to main and PRs are
    # gated by `check` alone: tests + lint, no 11-minute assembleDebug on every commit.
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch')
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # Set at runtime via $GITHUB_ENV in the "Name the APK" step. Declared here (empty) so static
      # linters don't flag the later ${{ env.APK_OUT }} references as "context access might be invalid".
      APK_OUT: ""
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'   # matches gradle/gradle-daemon-jvm.properties (toolchainVersion=25)

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          # 'tools' is obsolete and Google removed it from the SDK repository; the
          # action still asks for it by default, which fails the whole setup step.
          packages: 'platform-tools'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Compute version (from the git tag on releases)
        id: ver
        run: |
          if [ "$IS_TAG" = "true" ]; then
            NAME="${GITHUB_REF_NAME#v}"                 # tag v1.2.0 -> 1.2.0
            IFS='.' read -r MA MI PA <<< "$NAME"
            CODE=$(( ${MA:-0} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))   # 1.2.0 -> 10200
            [ "$CODE" -gt 0 ] || CODE=1
          else
            # Dev (non-tag) builds mirror the local-build fallback in app/build.gradle.kts:
            # pinned HIGH so a dev APK always installs over any published release
            # (no INSTALL_FAILED_VERSION_DOWNGRADE) and the in-app updater stays quiet.
            NAME="99.99.99"
            CODE=99999
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version: $NAME (code $CODE)"

      - name: Decode signing keystore (if configured)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          # Release tags MUST be signed: fail fast if the keystore secret is missing so a tag can
          # never publish a debug-signed APK as a release. Manual/dev runs may fall back to a
          # universal debug APK for testing.
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
            echo "Release signing configured."
          elif [ "$IS_TAG" = "true" ]; then
            echo "::error::Release tag requires KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD secrets."
            exit 1
          else
            echo "No KEYSTORE_BASE64 secret set — building a debug-signed dev APK."
          fi

      - name: Build APK (universal)
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          # One flavor, one APK: universal bundles arm64-v8a, armeabi-v7a and x86_64. No ABI
          # splits, no second artifact — this is the exact APK users download and publish.cmd ships.
          if [ -n "$KEYSTORE_FILE" ]; then
            echo "Building signed universal release APK"
            ./gradlew assembleUniversalRelease --stacktrace
            SRC=$(ls app/build/outputs/apk/universal/release/*.apk | head -n1)
          else
            echo "Building universal debug APK"
            ./gradlew assembleUniversalDebug --stacktrace
            SRC=$(ls app/build/outputs/apk/universal/debug/*.apk | head -n1)
          fi
          echo "Built: $SRC"
          echo "SRC=$SRC" >> "$GITHUB_ENV"

      - name: Name the APK (MoeTV_<version>_universal)
        run: |
          mkdir -p dist
          if [ "$IS_TAG" = "true" ]; then
            OUT="MoeTV_${{ steps.ver.outputs.name }}_universal.apk"
          else
            OUT="MoeTV-dev-${GITHUB_SHA::7}_universal.apk"
          fi
          cp "$SRC" "dist/$OUT"
          echo "APK_OUT=$OUT" >> "$GITHUB_ENV"
          echo "Packaged dist/$OUT (arm64-v8a + armeabi-v7a + x86_64)"
          # R8 retrace data belongs with the exact APK it describes. Debug builds (no keystore)
          # are not minified, so their mapping is simply absent.
          MAPPING=app/build/outputs/mapping/universalRelease/mapping.txt
          if [ -f "$MAPPING" ]; then
            if [ "$IS_TAG" = "true" ]; then
              MAP_OUT="MoeTV_${{ steps.ver.outputs.name }}_${{ steps.ver.outputs.code }}_mapping.txt"
            else
              MAP_OUT="MoeTV-dev-${GITHUB_SHA::7}_mapping.txt"
            fi
            cp "$MAPPING" "dist/$MAP_OUT"
            echo "Packaged dist/$MAP_OUT (R8 retrace map)"
          fi
          # Stable-named copy inside the CI artifact only — no public download URL is published here.
          if [ "$IS_TAG" = "true" ]; then
            cp "$SRC" "dist/MoeTV.apk"
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          # dist/ holds the single universal APK, the stable-named tag copy, and the R8 mapping
          # whenever the build was minified.
          name: ${{ env.APK_OUT }}
          path: dist/*
          if-no-files-found: error

