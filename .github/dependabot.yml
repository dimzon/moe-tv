# Держит GitHub Actions в воркфлоу актуальными (checkout, setup-java, upload-artifact…), чтобы
# внезапно снятая GitHub версия не сломала сборку. Один сгруппированный PR в месяц, проверяется CI
# и вливается человеком — старый workflow автослияния удалён. Зависимости Gradle и приложения
# намеренно не охватываются — они обновляются вручную.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
